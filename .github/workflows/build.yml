name: Zbuduj Dashboard (Windows .exe)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Pobierz kod z repozytorium
        uses: actions/checkout@v4

      - name: Zainstaluj Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.3'
          arch: 'win64_msvc2019_64'

      - name: Skonfiguruj projekt (CMake)
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_PREFIX_PATH="${{ env.QT_ROOT_DIR }}"

      - name: Zbuduj projekt
        run: cmake --build build --config Release

      - name: Skopiuj biblioteki Qt obok pliku .exe (windeployqt)
        shell: pwsh
        run: |
          $exePath = Get-ChildItem -Path build -Recurse -Filter "WarehouseDashboard.exe" | Select-Object -First 1
          windeployqt $exePath.FullName

      - name: Spakuj gotowy program
        shell: pwsh
        run: |
          $exePath = Get-ChildItem -Path build -Recurse -Filter "WarehouseDashboard.exe" | Select-Object -First 1
          $outDir = $exePath.DirectoryName
          Compress-Archive -Path "$outDir\*" -DestinationPath "DashboardMagazynowy-Windows.zip"

      - name: Udostepnij gotowy plik do pobrania
        uses: actions/upload-artifact@v4
        with:
          name: DashboardMagazynowy-Windows
          path: DashboardMagazynowy-Windows.zip
